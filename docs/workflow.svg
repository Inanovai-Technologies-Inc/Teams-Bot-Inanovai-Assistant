  <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="#10893E"/>
  </marker>
</defs>

<rect width="1600" height="900" fill="#F5F6FA"/>

<rect width="1600" height="90" fill="url(#hdr)"/>
<rect x="0" y="87" width="1600" height="3" fill="#5B5FC7"/>
<text x="40" y="44" font-size="28" font-weight="700" fill="#FFFFFF">Microsoft Teams AI Bot</text>
<text x="40" y="72" font-size="15" fill="#AEB4D6">System workflow — how a message travels from a Teams user to the AI model and back</text>
<rect x="1394" y="28" width="166" height="36" rx="18" fill="#5B5FC7"/>
<text x="1477" y="52" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">AI API · Python</text>

<text x="40" y="128" font-size="13" font-weight="700" fill="#5B5FC7" letter-spacing="2">MESSAGE FLOW</text>
<line x1="200" y1="123" x2="1560" y2="123" stroke="#DDE0EE" stroke-width="2"/>

<g filter="url(#sh)"><rect x="40" y="145" width="344" height="118" rx="12" fill="#FFFFFF"/></g>
<rect x="40" y="145" width="344" height="4" rx="2" fill="#5B5FC7"/>
<circle cx="72" cy="185" r="15" fill="#5B5FC7"/>
<text x="72" y="190" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="352" cy="180" r="9" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<path d="M340 200 a13 11 0 0 1 24 0" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<text x="98" y="191" font-size="17" font-weight="700" fill="#1B1F3B">Teams User</text>
<text x="66" y="221" font-size="13" fill="#5A6079">Types a message inside</text>
<text x="66" y="241" font-size="13" fill="#5A6079">Microsoft Teams.</text>

<g filter="url(#sh)"><rect x="432" y="145" width="344" height="118" rx="12" fill="#FFFFFF"/></g>
<rect x="432" y="145" width="344" height="4" rx="2" fill="#5B5FC7"/>
<circle cx="464" cy="185" r="15" fill="#5B5FC7"/>
<text x="464" y="190" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="730" y="172" width="28" height="20" rx="6" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<path d="M738 192 l0 8 l8 -8" fill="none" stroke="#C6C9E0" stroke-width="2.2" stroke-linejoin="round"/>
<text x="490" y="191" font-size="17" font-weight="700" fill="#1B1F3B">Microsoft Teams</text>
<text x="458" y="221" font-size="13" fill="#5A6079">Delivers the message to</text>
<text x="458" y="241" font-size="13" fill="#5A6079">the registered bot.</text>

<g filter="url(#sh)"><rect x="824" y="145" width="344" height="118" rx="12" fill="#FFFFFF"/></g>
<rect x="824" y="145" width="344" height="4" rx="2" fill="#5B5FC7"/>
<circle cx="856" cy="185" r="15" fill="#5B5FC7"/>
<text x="856" y="190" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<path d="M1114 192 a11 11 0 0 1 3 -21 a14 14 0 0 1 26 3 a9 9 0 0 1 -2 18 Z" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<text x="882" y="191" font-size="17" font-weight="700" fill="#1B1F3B">Azure Bot Service</text>
<text x="850" y="221" font-size="13" fill="#5A6079">Authenticates the bot and</text>
<text x="850" y="241" font-size="13" fill="#5A6079">routes the message on.</text>

<g filter="url(#sh)"><rect x="1216" y="145" width="344" height="118" rx="12" fill="#FFFFFF"/></g>
<rect x="1216" y="145" width="344" height="4" rx="2" fill="#5B5FC7"/>
<circle cx="1248" cy="185" r="15" fill="#5B5FC7"/>
<text x="1248" y="190" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="1500" y="176" width="21" height="14" rx="7" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<rect x="1516" y="176" width="21" height="14" rx="7" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<text x="1274" y="191" font-size="17" font-weight="700" fill="#1B1F3B">Dev Tunnel</text>
<text x="1242" y="221" font-size="13" fill="#5A6079">Public HTTPS bridge into</text>
<text x="1242" y="241" font-size="13" fill="#5A6079">the local machine.</text>

<line x1="392" y1="204" x2="422" y2="204" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>
<line x1="784" y1="204" x2="814" y2="204" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1176" y1="204" x2="1206" y2="204" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>

<path d="M1388 263 L1388 276 Q1388 285 1379 285 L221 285 Q212 285 212 294 L212 302" fill="none" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>

<g filter="url(#sh)"><rect x="40" y="316" width="344" height="118" rx="12" fill="#FFFFFF"/></g>
<rect x="40" y="316" width="344" height="4" rx="2" fill="#5B5FC7"/>
<circle cx="72" cy="356" r="15" fill="#5B5FC7"/>
<text x="72" y="361" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="338" y="343" width="26" height="7" rx="3" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<rect x="338" y="354" width="26" height="7" rx="3" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<rect x="338" y="365" width="26" height="7" rx="3" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<text x="98" y="362" font-size="17" font-weight="700" fill="#1B1F3B">app.py</text>
<text x="66" y="392" font-size="13" fill="#5A6079">Web server. Receives the</text>
<text x="66" y="412" font-size="13" fill="#5A6079">POST on /api/messages.</text>

<g filter="url(#sh)"><rect x="432" y="316" width="344" height="118" rx="12" fill="#FFFFFF"/></g>
<rect x="432" y="316" width="344" height="4" rx="2" fill="#5B5FC7"/>
<circle cx="464" cy="356" r="15" fill="#5B5FC7"/>
<text x="464" y="361" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<circle cx="745" cy="357" r="11" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<circle cx="745" cy="357" r="4" fill="none" stroke="#C6C9E0" stroke-width="2.2"/>
<text x="490" y="362" font-size="17" font-weight="700" fill="#1B1F3B">bot.py</text>
<text x="458" y="392" font-size="13" fill="#5A6079">Teams layer. Strips the</text>
<text x="458" y="412" font-size="13" fill="#5A6079">mention, blocks repeats.</text>

<g filter="url(#sh)"><rect x="824" y="316" width="344" height="118" rx="12" fill="#FFFFFF"/></g>
<rect x="824" y="316" width="344" height="4" rx="2" fill="#10893E"/>
<circle cx="856" cy="356" r="15" fill="#10893E"/>
<text x="856" y="361" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<circle cx="1137" cy="357" r="12" fill="none" stroke="#A8D8BA" stroke-width="2.2"/>
<path d="M1130 357 q7 -9 14 0 q-7 9 -14 0" fill="none" stroke="#A8D8BA" stroke-width="2.2"/>
<text x="882" y="362" font-size="17" font-weight="700" fill="#1B1F3B">agent.py</text>
<text x="850" y="392" font-size="13" fill="#5A6079">Agent layer. Adds memory</text>
<text x="850" y="412" font-size="13" fill="#5A6079">and builds the prompt.</text>

<g filter="url(#sh)"><rect x="1216" y="316" width="344" height="118" rx="12" fill="#FFFFFF"/></g>
<rect x="1216" y="316" width="344" height="4" rx="2" fill="#10893E"/>
<circle cx="1248" cy="356" r="15" fill="#10893E"/>
<text x="1248" y="361" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<path d="M1518 343 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="none" stroke="#A8D8BA" stroke-width="2.2" stroke-linejoin="round"/>
<text x="1274" y="362" font-size="17" font-weight="700" fill="#1B1F3B">AI API</text>
<text x="1242" y="392" font-size="13" fill="#5A6079">Generates the reply and</text>
<text x="1242" y="412" font-size="13" fill="#5A6079">returns it.</text>

<line x1="392" y1="375" x2="422" y2="375" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>
<line x1="784" y1="375" x2="814" y2="375" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1176" y1="375" x2="1206" y2="375" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>

<path d="M1388 434 L1388 452 Q1388 460 1379 460 L221 460 Q212 460 212 452 L212 440" fill="none" stroke="#10893E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arG)"/>
<rect x="640" y="443" width="320" height="34" rx="17" fill="#E7F4EC"/>
<text x="800" y="465" font-size="14" font-weight="600" fill="#10893E" text-anchor="middle">Reply returns along the same path</text>

<text x="40" y="522" font-size="13" font-weight="700" fill="#5B5FC7" letter-spacing="2">BUILT-IN SAFEGUARDS</text>
<line x1="270" y1="517" x2="1560" y2="517" stroke="#DDE0EE" stroke-width="2"/>

<g filter="url(#sh)"><rect x="40" y="540" width="344" height="102" rx="12" fill="#FFFFFF"/></g>
<rect x="40" y="540" width="5" height="102" rx="2" fill="#F2B705"/>
<text x="68" y="574" font-size="15" font-weight="700" fill="#1B1F3B">Typing Indicator</text>
<text x="68" y="602" font-size="12.5" fill="#5A6079">Refreshes every 4 seconds so</text>
<text x="68" y="621" font-size="12.5" fill="#5A6079">the chat never looks frozen.</text>

<g filter="url(#sh)"><rect x="432" y="540" width="344" height="102" rx="12" fill="#FFFFFF"/></g>
<rect x="432" y="540" width="5" height="102" rx="2" fill="#F2B705"/>
<text x="460" y="574" font-size="15" font-weight="700" fill="#1B1F3B">Duplicate Guard</text>
<text x="460" y="602" font-size="12.5" fill="#5A6079">Teams retries are ignored, so</text>
<text x="460" y="621" font-size="12.5" fill="#5A6079">nobody is answered twice.</text>

<g filter="url(#sh)"><rect x="824" y="540" width="344" height="102" rx="12" fill="#FFFFFF"/></g>
<rect x="824" y="540" width="5" height="102" rx="2" fill="#F2B705"/>
<text x="852" y="574" font-size="15" font-weight="700" fill="#1B1F3B">60 Second Timeout</text>
<text x="852" y="602" font-size="12.5" fill="#5A6079">A stalled request fails politely</text>
<text x="852" y="621" font-size="12.5" fill="#5A6079">instead of hanging forever.</text>

<g filter="url(#sh)"><rect x="1216" y="540" width="344" height="102" rx="12" fill="#FFFFFF"/></g>
<rect x="1216" y="540" width="5" height="102" rx="2" fill="#F2B705"/>
<text x="1244" y="574" font-size="15" font-weight="700" fill="#1B1F3B">Echo Fallback</text>
<text x="1244" y="602" font-size="12.5" fill="#5A6079">Runs without an API key, so</text>
<text x="1244" y="621" font-size="12.5" fill="#5A6079">the bot always starts.</text>

<text x="40" y="694" font-size="13" font-weight="700" fill="#5B5FC7" letter-spacing="2">LAYERED DESIGN</text>
<line x1="220" y1="689" x2="1560" y2="689" stroke="#DDE0EE" stroke-width="2"/>

<g filter="url(#sh)"><rect x="40" y="712" width="880" height="56" rx="10" fill="#5B5FC7"/></g>
<text x="66" y="736" font-size="15" font-weight="700" fill="#FFFFFF">Teams Layer — app.py and bot.py</text>
<text x="66" y="757" font-size="12.5" fill="#D6D8F2">Speaks Teams. Holds no intelligence. Never changes.</text>

<g filter="url(#sh)"><rect x="40" y="780" width="880" height="56" rx="10" fill="#10893E"/></g>
<text x="66" y="804" font-size="15" font-weight="700" fill="#FFFFFF">Agent Layer — agent.py</text>
<text x="66" y="825" font-size="12.5" fill="#CFE8D8">Holds the intelligence. Knows nothing about Teams. Fully swappable.</text>

<text x="964" y="732" font-size="12.5" font-weight="700" fill="#5A6079" letter-spacing="1">SWAPPABLE BRAIN</text>
<rect x="964" y="752" width="146" height="48" rx="9" fill="#FFFFFF" stroke="#DDE0EE" stroke-width="2"/>
<text x="1037" y="774" font-size="14" font-weight="600" fill="#9096AE" text-anchor="middle">Echo Bot</text>
<text x="1037" y="791" font-size="11" fill="#B4B9CC" text-anchor="middle">done</text>
