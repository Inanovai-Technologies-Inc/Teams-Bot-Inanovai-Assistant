<rect x="1152" y="746" width="158" height="60" rx="9" fill="#10893E"/>
<text x="1231" y="772" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI API</text>
<text x="1231" y="791" font-size="11" fill="#CFE8D8" text-anchor="middle">live now</text>
<path d="M1320 776 l14 0" stroke="#C6C9E0" stroke-width="3" marker-end="url(#ar)"/>
<rect x="1352" y="752" width="148" height="48" rx="9" fill="#FFFFFF" stroke="#DDE0EE" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1426" y="774" font-size="14" font-weight="600" fill="#9096AE" text-anchor="middle">NemoClaw</text>
<text x="1426" y="791" font-size="11" fill="#B4B9CC" text-anchor="middle">planned</text>
</svg>
