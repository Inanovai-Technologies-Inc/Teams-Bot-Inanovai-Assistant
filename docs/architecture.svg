<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<defs>
  <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1B1F3B"/><stop offset="100%" stop-color="#2E3566"/>
  </linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1B1F3B" flood-opacity="0.13"/>
  </filter>
  <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="#5B5FC7"/>
  </marker>
  <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="#10893E"/>
  </marker>
</defs>

<rect width="1600" height="1060" fill="#F5F6FA"/>

<!-- header -->
<rect width="1600" height="90" fill="url(#hdr)"/>
<rect x="0" y="87" width="1600" height="3" fill="#5B5FC7"/>
<text x="40" y="44" font-size="28" font-weight="700" fill="#FFFFFF">Inanovai Assistant — Architecture</text>
<text x="40" y="72" font-size="15" fill="#AEB4D6">Three chat apps, one bot, one brain</text>
<rect x="1330" y="28" width="230" height="36" rx="18" fill="#5B5FC7"/>
<text x="1445" y="52" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Python · Azure · AI API</text>

<!-- ROW 1 : people -->
<text x="40" y="128" font-size="12" font-weight="700" fill="#5B5FC7" letter-spacing="2">WHO IS TALKING</text>
<line x1="230" y1="123" x2="1560" y2="123" stroke="#DDE0EE" stroke-width="2"/>

<g filter="url(#sh)"><rect x="90" y="146" width="420" height="78" rx="12" fill="#FFFFFF"/></g>
<rect x="90" y="146" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="300" y="182" font-size="18" font-weight="700" fill="#1B1F3B" text-anchor="middle">Microsoft Teams user</text>
<text x="300" y="206" font-size="13" fill="#5A6079" text-anchor="middle">live today</text>

<g filter="url(#sh)"><rect x="590" y="146" width="420" height="78" rx="12" fill="#FFFFFF"/></g>
<rect x="590" y="146" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="800" y="182" font-size="18" font-weight="700" fill="#1B1F3B" text-anchor="middle">Telegram user</text>
<text x="800" y="206" font-size="13" fill="#5A6079" text-anchor="middle">code ready, needs a token</text>

<g filter="url(#sh)"><rect x="1090" y="146" width="420" height="78" rx="12" fill="#FFFFFF"/></g>
<rect x="1090" y="146" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="1300" y="182" font-size="18" font-weight="700" fill="#1B1F3B" text-anchor="middle">WhatsApp user</text>
<text x="1300" y="206" font-size="13" fill="#5A6079" text-anchor="middle">code ready, needs Meta setup</text>

<line x1="300" y1="224" x2="300" y2="264" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>
<line x1="800" y1="224" x2="800" y2="264" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1300" y1="224" x2="1300" y2="264" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>

<!-- ROW 2 : platforms -->
<text x="40" y="300" font-size="12" font-weight="700" fill="#5B5FC7" letter-spacing="2">THE POSTMAN</text>
<line x1="190" y1="295" x2="1560" y2="295" stroke="#DDE0EE" stroke-width="2"/>

<g filter="url(#sh)"><rect x="90" y="318" width="420" height="86" rx="12" fill="#FFFFFF"/></g>
<rect x="90" y="318" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="300" y="352" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="middle">Azure Bot Service</text>
<text x="300" y="376" font-size="13" fill="#5A6079" text-anchor="middle">checks the bot is genuine,</text>
<text x="300" y="394" font-size="13" fill="#5A6079" text-anchor="middle">then forwards the message</text>

<g filter="url(#sh)"><rect x="590" y="318" width="420" height="86" rx="12" fill="#FFFFFF"/></g>
<rect x="590" y="318" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="800" y="352" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="middle">Telegram Bot API</text>
<text x="800" y="376" font-size="13" fill="#5A6079" text-anchor="middle">posts every message to</text>
<text x="800" y="394" font-size="13" fill="#5A6079" text-anchor="middle">our webhook</text>

<g filter="url(#sh)"><rect x="1090" y="318" width="420" height="86" rx="12" fill="#FFFFFF"/></g>
<rect x="1090" y="318" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="1300" y="352" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="middle">Meta Cloud API</text>
<text x="1300" y="376" font-size="13" fill="#5A6079" text-anchor="middle">posts every message to</text>
<text x="1300" y="394" font-size="13" fill="#5A6079" text-anchor="middle">our webhook</text>

<line x1="300" y1="404" x2="300" y2="466" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>
<line x1="800" y1="404" x2="800" y2="466" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1300" y1="404" x2="1300" y2="466" stroke="#5B5FC7" stroke-width="3" marker-end="url(#ar)"/>

<!-- ROW 3 : our server -->
<text x="40" y="446" font-size="12" font-weight="700" fill="#5B5FC7" letter-spacing="2">OUR CODE, ON AZURE</text>
<line x1="290" y1="441" x2="1560" y2="441" stroke="#DDE0EE" stroke-width="2"/>

<rect x="66" y="466" width="1468" height="230" rx="16" fill="#EDEEF8" stroke="#C6C9E0" stroke-width="2"/>
<text x="90" y="496" font-size="14" font-weight="700" fill="#5B5FC7">Azure App Service — inanovai-teams-bot.azurewebsites.net</text>
<text x="90" y="518" font-size="12.5" fill="#5A6079">app.py listens on three addresses. Each one hands plain text to the same agent.</text>

<g filter="url(#sh)"><rect x="90" y="536" width="420" height="138" rx="12" fill="#FFFFFF"/></g>
<rect x="90" y="536" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="300" y="566" font-size="14" font-weight="700" fill="#5B5FC7" text-anchor="middle">POST /api/messages</text>
<text x="300" y="596" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="middle">bot.py</text>
<text x="300" y="622" font-size="13" fill="#5A6079" text-anchor="middle">strips the @mention,</text>
<text x="300" y="640" font-size="13" fill="#5A6079" text-anchor="middle">blocks repeat deliveries,</text>
<text x="300" y="658" font-size="13" fill="#5A6079" text-anchor="middle">shows the typing bubble</text>

<g filter="url(#sh)"><rect x="590" y="536" width="420" height="138" rx="12" fill="#FFFFFF"/></g>
<rect x="590" y="536" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="800" y="566" font-size="14" font-weight="700" fill="#5B5FC7" text-anchor="middle">POST /telegram/webhook</text>
<text x="800" y="596" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="middle">channels/telegram.py</text>
<text x="800" y="622" font-size="13" fill="#5A6079" text-anchor="middle">checks the secret header,</text>
<text x="800" y="640" font-size="13" fill="#5A6079" text-anchor="middle">answers only when mentioned</text>
<text x="800" y="658" font-size="13" fill="#5A6079" text-anchor="middle">in a group</text>

<g filter="url(#sh)"><rect x="1090" y="536" width="420" height="138" rx="12" fill="#FFFFFF"/></g>
<rect x="1090" y="536" width="420" height="4" rx="2" fill="#5B5FC7"/>
<text x="1300" y="566" font-size="14" font-weight="700" fill="#5B5FC7" text-anchor="middle">GET / POST /whatsapp/webhook</text>
<text x="1300" y="596" font-size="17" font-weight="700" fill="#1B1F3B" text-anchor="middle">channels/whatsapp.py</text>
<text x="1300" y="622" font-size="13" fill="#5A6079" text-anchor="middle">answers Meta's verification,</text>
<text x="1300" y="640" font-size="13" fill="#5A6079" text-anchor="middle">checks the signature,</text>
<text x="1300" y="658" font-size="13" fill="#5A6079" text-anchor="middle">marks messages read</text>

<!-- converge into the agent -->
<path d="M300 696 L300 726 Q300 736 310 736 L790 736" fill="none" stroke="#10893E" stroke-width="3"/>
<path d="M1300 696 L1300 726 Q1300 736 1290 736 L810 736" fill="none" stroke="#10893E" stroke-width="3"/>
<line x1="800" y1="696" x2="800" y2="736" stroke="#10893E" stroke-width="3"/>
<line x1="800" y1="736" x2="800" y2="776" stroke="#10893E" stroke-width="3" marker-end="url(#arG)"/>

<!-- ROW 4 : the agent -->
<g filter="url(#sh)"><rect x="440" y="796" width="720" height="96" rx="12" fill="#10893E"/></g>
<text x="800" y="832" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">agent.py — the brain</text>
<text x="800" y="858" font-size="13" fill="#CFE8D8" text-anchor="middle">adds the recent history for this conversation, builds the prompt</text>
<text x="800" y="878" font-size="13" fill="#CFE8D8" text-anchor="middle">knows nothing about Teams, Telegram or WhatsApp</text>

<line x1="800" y1="892" x2="800" y2="932" stroke="#10893E" stroke-width="3" marker-end="url(#arG)"/>

<g filter="url(#sh)"><rect x="440" y="944" width="720" height="80" rx="12" fill="#FFFFFF"/></g>
<rect x="440" y="944" width="720" height="4" rx="2" fill="#10893E"/>
<text x="800" y="980" font-size="18" font-weight="700" fill="#1B1F3B" text-anchor="middle">AI API — Llama 3.3 70B</text>
<text x="800" y="1004" font-size="13" fill="#5A6079" text-anchor="middle">writes the answer, which returns the way it came</text>

<!-- side note : memory -->
<g filter="url(#sh)"><rect x="66" y="796" width="340" height="140" rx="12" fill="#FFFFFF"/></g>
<rect x="66" y="796" width="5" height="140" rx="2" fill="#F2B705"/>
<text x="94" y="828" font-size="15" font-weight="700" fill="#1B1F3B">Chats stay separate</text>
<text x="94" y="856" font-size="12.5" fill="#5A6079">Every conversation gets its own</text>
<text x="94" y="874" font-size="12.5" fill="#5A6079">memory, labelled by platform:</text>
<text x="94" y="898" font-size="12.5" font-weight="700" fill="#5B5FC7">telegram:555</text>
<text x="94" y="916" font-size="12.5" font-weight="700" fill="#5B5FC7">whatsapp:9199...</text>
<text x="212" y="898" font-size="12.5" fill="#5A6079">— never mixed</text>

<!-- side note : safeguards -->
<g filter="url(#sh)"><rect x="1194" y="796" width="340" height="140" rx="12" fill="#FFFFFF"/></g>
<rect x="1194" y="796" width="5" height="140" rx="2" fill="#F2B705"/>
<text x="1222" y="828" font-size="15" font-weight="700" fill="#1B1F3B">Same safeguards everywhere</text>
<text x="1222" y="856" font-size="12.5" fill="#5A6079">No duplicate answers</text>
<text x="1222" y="878" font-size="12.5" fill="#5A6079">60 second timeout</text>
<text x="1222" y="900" font-size="12.5" fill="#5A6079">Long replies split automatically</text>
<text x="1222" y="922" font-size="12.5" fill="#5A6079">Errors never crash a chat</text>
</svg>
